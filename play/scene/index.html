<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>The Finder: Encounter scene</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #9fe6d6; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #hud { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); }
  #hud button { background: rgba(20, 16, 60, 0.7); color: #9fe6d6; border: 1px solid #3c3a8a; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  #info { position: fixed; left: 12px; top: 10px; opacity: 0.8; white-space: pre; pointer-events: none; }
  body.clean #hud, body.clean #info { display: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="info"></div>
<div id="hud"></div>
<script type="module" src="/src/play/scene/main.ts"></script>
</body>
</html>
